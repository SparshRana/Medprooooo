name: Check subscribed batches
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: medpro-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: vars.MEDPRO_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEDPRO_MONITORING_ENABLED: 'true'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MEDPRO_ALERT_FROM: ${{ secrets.MEDPRO_ALERT_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm alerts:latest
      - run: pnpm alerts:monitor
